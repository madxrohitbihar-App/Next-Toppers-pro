<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Toppers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            position: relative;
        }
        /* Top Custom Header - Highest z-index taaki peeche ka content hide rahe */
        .top-header {
            background: #ffffff;
            color: #000000;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            min-height: 65px;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }
        .brand-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-info img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0088cc;
        }
        .brand-text h1 {
            font-size: 18px;
            color: #0f172a;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .brand-text span {
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        /* Iframe Container - Negative margin ki wajah se website ka upar wala header custom header ke peeche chup jayega */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            background: #ffffff;
            position: relative;
            margin-top: -65px; 
            z-index: 1;
        }
        iframe {
            width: 100%;
            height: calc(100% + 65px);
            border: none;
            display: block;
        }
        /* Footer Branding */
        .footer-credit {
            background: #f8fafc;
            color: #64748b;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
            min-height: 35px;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }

        /* Popup Styles */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .popup-box {
            background: #ffffff;
            width: 90%;
            max-width: 380px;
            padding: 30px 20px 25px 20px;
            border-radius: 14px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            border: 1px solid #e2e8f0;
            text-align: center;
            color: #0f172a;
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popup-overlay.show .popup-box {
            transform: scale(1);
        }
        .close-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 30px;
            height: 30px;
            background: #f1f5f9;
            color: #0f172a;
            border: none;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .close-icon:hover {
            background: #ef4444;
            color: white;
            transform: scale(1.1);
        }
        .popup-box h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #0284c7;
        }
        .popup-box p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .popup-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }
        .whatsapp-btn {
            background-color: #25D366;
            color: white;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }
        .telegram-btn {
            background-color: #0088cc;
            color: white;
        }
        .telegram-btn:hover {
            background-color: #0077b5;
        }
    </style>
</head>
<body>

    <!-- Popup Modal -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <button class="close-icon" onclick="closePopup()">✕</button>
            <h2>Join Our Updates</h2>
            <p>Important links ke liye hamare official channel ko join karein!</p>
            
            <a href="https://whatsapp.com/channel/0029Vb6FhReEquiLz1jNH00o" target="_blank" class="popup-btn whatsapp-btn">
                Join WhatsApp Channel
            </a>
            
            <a href="https://t.me/+cw7TRotEzcczNThl" target="_blank" class="popup-btn telegram-btn">
                Join Telegram Group
            </a>
        </div>
    </div>

    <div class="app-container">
        <!-- Top Custom Header -->
        <header class="top-header">
            <div class="brand-info">
                <img src="https://i.postimg.cc/2yf3sPqb/IMG-20260731-232914-129.jpg" alt="Logo">
                <div class="brand-text">
                    <h1>NEXT TOPPERS</h1>
                    <span>POWERED BY MADXROHITBIHAR</span>
                </div>
            </div>
        </header>

        <!-- Main Proxy Website Area -->
        <div class="iframe-container">
            <iframe src="https://vidyaverse-nt.vercel.app/" allowfullscreen></iframe>
        </div>

        <!-- Footer Developer Credit -->
        <footer class="footer-credit">
            Developer By MedxrohitBihar 2026
        </footer>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('popupOverlay').classList.add('show');
            }, 3000);
        });

        function closePopup() {
            document.getElementById('popupOverlay').classList.remove('show');
        }
    </script>

</body>
</html>
